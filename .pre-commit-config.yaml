# Install once: pip install -e ".[dev]" && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false
        stages: [pre-push]
