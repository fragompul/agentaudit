name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests with coverage gate
        run: pytest --cov=agentaudit --cov-report=term-missing --cov-fail-under=90
      - name: CLI smoke test
        run: |
          agentaudit demo --tasks 40 --runs 3
          agentaudit bench audit --per-family 10

  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests scripts web
      - run: ruff check src tests scripts web
      - run: mypy src

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the ES modules
        run: for f in web/js/*.js; do node --input-type=module --check < "$f"; done
      - run: python scripts/build_site.py
      - name: The shipped zip imports and analyses
        run: |
          pip install numpy scipy
          python - <<'PY'
          import sys, zipfile, tempfile
          with tempfile.TemporaryDirectory() as tmp:
              zipfile.ZipFile("site/py/agentaudit.zip").extractall(tmp)
              sys.path.insert(0, tmp)
              import agentaudit
              from agentaudit.simulate import SyntheticPopulation
              from agentaudit.analysis import analyze
              out = analyze(SyntheticPopulation((0.0, 1.0)).sample(30, 3, 0), n_boot=100)
              print(agentaudit.__version__, out["n_models"], "agents analysed from the site bundle")
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5"
      - run: mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentaudit:ci .
      - run: docker run --rm agentaudit:ci demo --tasks 30 --runs 3
