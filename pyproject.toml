[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
dynamic = ["version"]
description = "Statistically rigorous evaluation of LLM agents: intervals, variance decomposition, ranking uncertainty, power planning and an offline deterministic benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gómez Pulido" }]
keywords = ["llm", "agents", "evaluation", "statistics", "benchmark", "pass-at-k", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/fragompul/agentaudit"
Documentation = "https://fragompul.github.io/agentaudit/docs/"
Demo = "https://fragompul.github.io/agentaudit/"
Changelog = "https://github.com/fragompul/agentaudit/blob/main/CHANGELOG.md"
Issues = "https://github.com/fragompul/agentaudit/issues"

[project.scripts]
agentaudit = "agentaudit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100",
    "statsmodels>=0.14", "pandas>=2.0", "scipy-stubs",
]
plots = ["matplotlib>=3.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]
ollama = []  # uses the local HTTP API via the standard library; no extra deps

[tool.setuptools.dynamic]
version = { attr = "agentaudit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentaudit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["agentaudit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["statsmodels.*", "pandas.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/agentaudit/bench/words.py" = ["E501"]
"src/agentaudit/report.py" = ["E501"]
"scripts/make_paper_assets.py" = ["E501"]
"scripts/make_results_docs.py" = ["E501"]
